version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    # Политика (v0.7):
    # - minSdk 14: AndroidX новее 1.6.x требует minSdk 19 — бампить нельзя;
    # - BC-артефакты обновляются ТОЛЬКО согласованным сетом (groups);
    # - мажорные AGP/Gradle — отдельным скоординированным апгрейдом, не ботом.
    groups:
      bouncycastle:
        patterns:
          - "org.bouncycastle:*"
    ignore:
      - dependency-name: "androidx.appcompat:appcompat"
        versions: [">=1.7"]
      # minSdk 14: core-ktx новее 1.9.0 требует minSdk 19/21 (PR #15 принят намеренно не будет)
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.10"]
      # material новее 1.9.0 тоже уходит с minSdk 14
      - dependency-name: "com.google.android.material:material"
        versions: [">=1.10"]
      # robolectric 4.15+ теряет SDK 21 — а это наш тест Android 4+ совместимости
      - dependency-name: "org.robolectric:robolectric"
        versions: [">=4.15"]
      # androidx.test:core-ktx (minSdk 19/21) разрешён любым — test-only, в APK не попадает
      # и под AGP 8.7.3 unit-test манифест-мерж его не трогает
      # AGP любой версии — только координированный апгрейд руками: 8.13+ ломает minSdk 14
      # (unit-test манифест-мерж без overrideLibrary), патчи тоже через политику
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/assets/brand"
    schedule:
      interval: "monthly"
