name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Быстрее и дешевле: новый пуш отменяет устаревший прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test/vet/fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # Гейт race (без coverage: instrumentation замедляет тайминговые тесты
      # на CI-раннерах — отдельный флейк ловим точечно)
      - name: test (race)
        run: go test -race -count=1 -timeout 10m ./...
      # Гейт coverage (без race — быстрее и стабильнее; race уже проверен выше)
      - name: coverage gate
        run: |
          go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
          load: true
          tags: "reverseray:ci"
      - name: Smoke healthcheck binary exists
        run: docker run --rm --entrypoint /reverseray "reverseray:ci" version

  android:
    name: Android build (debug + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Целостность gradle-wrapper.jar (supply-chain gate перед сборкой)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Кэш Gradle (wrapper + зависимости): ускоряет прогрев с ~5-8 мин до ~1-2 мин
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build + unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --build-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: android/app/build/test-results/
          if-no-files-found: ignore

  assets:
    name: Brand assets (regen + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Unit tests for generator
        run: python3 -m unittest discover -s assets/brand -p 'test_*.py' -v
      - name: Verify committed assets match generator
        run: python3 assets/brand/generate.py --check

  # v0.8: целостность общего манифеста модулей (APK ↔ сервер)
  modules:
    name: Modules integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifest canon check (schema/rrp1/duplicates/policy)
        run: python3 scripts/modules_check.py modules/modules.json
      - name: Go parser agrees (module tests)
        working-directory: server
        run: |
          go vet ./internal/modules/ ./internal/rrp/
          go test -count=1 ./internal/modules/ ./internal/rrp/

  # v0.8: приватность — ни телеметрии, ни внешних хостов вне белого списка,
  # ни реальных токенов/приватных IP в доках
  privacy-audit:
    name: Privacy audit (no leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for telemetry / unknown hosts / private data in docs
        run: python3 scripts/privacy_audit.py .

  # v0.8: known-vulnerabilities gate (stdlib Go)
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Run govulncheck
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

  # v0.8: реальный скриншот APK на главной репо (не «рисунок в Paint»):
  # Robolectric рендерит MainActivity, робот коммитит PNG в assets/brand
  screenshot:
    name: Real app screenshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Render screenshot via Robolectric
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -Drr.screenshot.out=build/screenshot/app.png \
            --tests "dev.stelgen.reverseray.ScreenshotTest"
      - name: Commit screenshot if changed
        working-directory: android
        run: |
          if [ ! -f build/screenshot/app.png ]; then echo "no screenshot"; exit 1; fi
          cp build/screenshot/app.png ../assets/brand/screenshot.png
          cd ..
          if git diff --quiet assets/brand/screenshot.png; then
            echo "screenshot unchanged"
          else
            git config user.name "reverseray-screenshot-bot"
            git config user.email "bot@reverseray.local"
            git add assets/brand/screenshot.png
            git commit -m "[skip ci] docs: real APK screenshot (auto-rendered by CI)"
            git push
          fi

  # Секреты не пушим: docs/WORKFLOW.md обещает gitleaks в CI — вот он (v0.7)
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR-гейт: залетевшая уязвимая зависимость не доедет до main
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review@v4
