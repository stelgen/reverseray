name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Быстрее и дешевле: новый пуш отменяет устаревший прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test/vet/fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # Гейт race (без coverage: instrumentation замедляет тайминговые тесты
      # на CI-раннерах — отдельный флейк ловим точечно)
      - name: test (race)
        run: go test -race -count=1 -timeout 10m ./...
      # Гейт coverage (без race — быстрее и стабильнее; race уже проверен выше)
      - name: coverage gate
        run: |
          go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  docker:
    name: Docker run + healthcheck (real entrypoint)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
          load: true
          tags: "reverseray:ci"
      # v0.8.3: образ запускается КАК В ПРОДЕ — с родным ENTRYPOINT (governor).
      # Раньше smoke подменял entrypoint на /reverseray и пропускал поломку
      # боевого запуска («exec /bin/busybox: no such file or directory»).
      # Бот ждёт healthcheck до 90 с; упал контейнер/не healthy → красный
      # прогон с docker logs + inspect в выводе.
      - name: Run container (real entrypoint) and wait for healthcheck
        run: |
          set -euo pipefail
          docker run -d --name rr-smoke reverseray:ci
          ok=""
          for i in $(seq 1 45); do
            st=$(docker inspect --format '{{.State.Health.Status}}' rr-smoke 2>/dev/null || echo unknown)
            if [ "$st" = "healthy" ]; then ok=1; break; fi
            cstate=$(docker inspect --format '{{.State.Status}}' rr-smoke 2>/dev/null || echo unknown)
            if [ "$cstate" = "exited" ]; then echo "container exited before healthy"; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Контейнер не стал healthy за 90 с (или умер раньше)"
            docker ps -a --filter name=rr-smoke || true
            docker inspect rr-smoke || true
            docker logs --tail 100 rr-smoke || true
            exit 1
          fi
          echo "container healthy"
          docker rm -f rr-smoke
      # Полный путь деплоя rr.sh: родной compose.yaml (state-volume, user 0:0,
      # cap_drop ALL, healthcheck). --wait сам ждёт healthy; при отказе —
      # диагностика в step-summary + артефакт (логи джоб без токена нечитаемы).
      - name: Compose smoke (native compose.yaml + healthcheck)
        run: |
          set -euo pipefail
          docker compose version
          docker tag reverseray:ci ghcr.io/stelgen/reverseray:ci-smoke
          if ! RR_IMAGE_TAG=ci-smoke docker compose up -d --wait --wait-timeout 180; then
            {
              echo "## Compose smoke FAILED"
              echo '```'
              docker images | head -8 || true
              docker compose ps -a || true
              docker compose logs --tail 200 reverseray || true
              docker inspect reverseray --format '{{json .State.Health}}' || true
              docker inspect reverseray --format '{{json .State}}' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            mkdir -p diag
            { docker compose ps -a; echo; docker compose logs reverseray; echo; docker inspect reverseray; } > diag/compose-smoke.txt 2>&1 || true
            exit 1
          fi
          curl -fsS --max-time 5 http://127.0.0.1:9090/healthz || { echo "::error::healthz недоступен"; docker compose logs --tail 50 reverseray; exit 1; }
          echo "compose smoke healthy"
          docker compose down -v
          # state писался контейнером от root (canon user 0:0 для bind-маунта) —
          # у раннера нет прав на rm без sudo (CI #70); sudo на раннерах парольless
          sudo rm -rf state
      - name: Upload compose smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: compose-smoke-diagnostics
          path: diag/
          if-no-files-found: ignore

  android:
    name: Android build (debug + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Целостность gradle-wrapper.jar (supply-chain gate перед сборкой)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Кэш Gradle (wrapper + зависимости): ускоряет прогрев с ~5-8 мин до ~1-2 мин
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build + unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --build-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: android/app/build/test-results/
          if-no-files-found: ignore

  assets:
    name: Brand assets (regen + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Unit tests for generator
        run: python3 -m unittest discover -s assets/brand -p 'test_*.py' -v
      - name: Verify committed assets match generator
        run: python3 assets/brand/generate.py --check

  # v0.8: целостность общего манифеста модулей (APK ↔ сервер)
  modules:
    name: Modules integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifest canon check (schema/rrp1/duplicates/policy)
        run: python3 scripts/modules_check.py modules/modules.json
      - name: Go parser agrees (module tests)
        working-directory: server
        run: |
          go vet ./internal/modules/ ./internal/rrp/
          go test -count=1 ./internal/modules/ ./internal/rrp/

  # v0.8: приватность — ни телеметрии, ни внешних хостов вне белого списка,
  # ни реальных токенов/приватных IP в доках
  privacy-audit:
    name: Privacy audit (no leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for telemetry / unknown hosts / private data in docs
        run: python3 scripts/privacy_audit.py .

  # v0.8: known-vulnerabilities gate (stdlib Go)
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Run govulncheck
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

  # Секреты не пушим: docs/WORKFLOW.md обещает gitleaks в CI — вот он (v0.7)
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR-гейт: залетевшая уязвимая зависимость не доедет до main
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review@v4
