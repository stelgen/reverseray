name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Быстрее и дешевле: новый пуш отменяет устаревший прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test/vet/fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # Гейт race (без coverage: instrumentation замедляет тайминговые тесты
      # на CI-раннерах — отдельный флейк ловим точечно)
      - name: test (race)
        run: go test -race -count=1 -shuffle=on -timeout 10m ./...
      # Гейт coverage (без race — быстрее и стабильнее; race уже проверен выше)
      - name: coverage gate
        run: |
          go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  docker:
    name: Docker run + healthcheck (real entrypoint)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./server
          push: false
          load: true
          tags: "reverseray:ci"
      # v0.8.3: образ запускается КАК В ПРОДЕ — с родным ENTRYPOINT (governor).
      # Раньше smoke подменял entrypoint на /reverseray и пропускал поломку
      # боевого запуска («exec /bin/busybox: no such file or directory»).
      # Бот ждёт healthcheck до 90 с; упал контейнер/не healthy → красный
      # прогон с docker logs + inspect в выводе.
      - name: Run container (real entrypoint) and wait for healthcheck
        run: |
          set -euo pipefail
          docker run -d --name rr-smoke reverseray:ci
          ok=""
          for i in $(seq 1 45); do
            st=$(docker inspect --format '{{.State.Health.Status}}' rr-smoke 2>/dev/null || echo unknown)
            if [ "$st" = "healthy" ]; then ok=1; break; fi
            cstate=$(docker inspect --format '{{.State.Status}}' rr-smoke 2>/dev/null || echo unknown)
            if [ "$cstate" = "exited" ]; then echo "container exited before healthy"; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Контейнер не стал healthy за 90 с (или умер раньше)"
            docker ps -a --filter name=rr-smoke || true
            docker inspect rr-smoke || true
            docker logs --tail 100 rr-smoke || true
            exit 1
          fi
          echo "container healthy"
          docker rm -f rr-smoke
      # Полный путь деплоя rr.sh: родной compose.yaml (state-volume, user 0:0,
      # cap_drop ALL, healthcheck). --wait сам ждёт healthy; при отказе —
      # диагностика в step-summary + артефакт (логи джоб без токена нечитаемы).
      - name: Compose smoke (native compose.yaml + healthcheck)
        run: |
          set -euo pipefail
          docker compose version
          docker tag reverseray:ci ghcr.io/stelgen/reverseray:ci-smoke
          if ! RR_IMAGE_TAG=ci-smoke docker compose up -d --wait --wait-timeout 180; then
            {
              echo "## Compose smoke FAILED"
              echo '```'
              docker images | head -8 || true
              docker compose ps -a || true
              docker compose logs --tail 200 reverseray || true
              docker inspect reverseray --format '{{json .State.Health}}' || true
              docker inspect reverseray --format '{{json .State}}' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            mkdir -p diag
            { docker compose ps -a; echo; docker compose logs reverseray; echo; docker inspect reverseray; } > diag/compose-smoke.txt 2>&1 || true
            exit 1
          fi
          curl -fsS --max-time 5 http://127.0.0.1:9090/healthz || { echo "::error::healthz недоступен"; docker compose logs --tail 50 reverseray; exit 1; }
          echo "compose smoke healthy"
          docker compose down -v
          # state писался контейнером от root (canon user 0:0 для bind-маунта) —
          # у раннера нет прав на rm без sudo (CI #70); sudo на раннерах парольless
          sudo rm -rf state
      - name: Upload compose smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke-diagnostics
          path: diag/
          if-no-files-found: ignore

  android:
    name: Android build (debug + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      # Целостность gradle-wrapper.jar (supply-chain gate перед сборкой)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Кэш Gradle (wrapper + зависимости): ускоряет прогрев с ~5-8 мин до ~1-2 мин
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Robolectric тянет ~400 МБ android-all jar'ов на КАЖДЫЙ ранн своим фетчером
      # в ~/.m2 (без ретраев) — транзиентный 404 CDN роняет ВСЕ Robolectric-тесты
      # разом (реальный случай: CI v1.9.0, 40 фейлов FileNotFoundException).
      # Гасим: кэш ~/.m2/org.robolectric + предзагрузка с ретраями до тестов.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-4.14.1-v1
      - name: Prefetch Robolectric android-all (retry)
        run: |
          # Собственный зеркальный origin на lith (публичная статика без CDN-мешков,
          # откуда на раннерах GitHub шло 404 на все jar) + три origin'а Maven Central.
          origins="https://pushpolezginski.xyz/maven2 https://maven-central.storage-download.googleapis.com/maven2 https://gcp.mirrors.maven.org/maven2 https://repo1.maven.org/maven2"
          for v in 15-robolectric-12650502-i7 12-robolectric-7732740-i7 5.0.2_r3-robolectric-r0-i7; do
            dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$v"
            for f in "$v.jar" "$v.pom"; do
              out="$dir/$f"
              if [ -s "$out" ] && [ "$(stat -c%s "$out")" -gt 1000 ]; then
                echo "cached: $f"; continue
              fi
              mkdir -p "$dir"
              ok=0
              for i in 1 2 3 4 5; do
                for origin in $origins; do
                  if curl -fsSL --connect-timeout 20 \
                       -o "$out.tmp" "$origin/org/robolectric/android-all-instrumented/$v/$f"; then
                    mv "$out.tmp" "$out"; echo "fetched: $f <- $origin"; ok=1; break
                  fi
                  rm -f "$out.tmp"
                done
                # v1.9.1: if-форма вместо «[ … ] && break» — при ok=0 старая запись
                # возвращала 1 и под bash -e убивала весь степ на первой осечке сети.
                if [ "$ok" = 1 ]; then break; fi
                echo "retry $i for $f"; sleep 15
              done
              # v1.9.1: префетч — best-effort: не роняем джобу, фетчер Robolectric
              # скачает недостающее сам (см. robolectric.dependency.repo.url ниже).
              if [ "$ok" != 1 ]; then echo "WARN: prefetch failed for $f (продолжаем)"; fi
            done
          done
      - name: Build + unit tests
        run: |
          chmod +x gradlew
          # v1.9.1: фетчер Robolectric качает с Google-зеркала (не с repo1 edge-CDN,
          # чей 404 на большие jar и был исходным флейком).
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --build-cache \
            -Drobolectric.dependency.repo.url=https://pushpolezginski.xyz/maven2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: android/app/build/test-results/
          if-no-files-found: ignore

  assets:
    name: Brand assets (regen + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Unit tests for generator
        run: python3 -m unittest discover -s assets/brand -p 'test_*.py' -v
      - name: Verify committed assets match generator
        run: python3 assets/brand/generate.py --check

  # v0.8: целостность общего манифеста модулей (APK ↔ сервер)
  modules:
    name: Modules integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Manifest canon check (schema/rrp1/duplicates/policy)
        run: python3 scripts/modules_check.py modules/modules.json
      - name: Go parser agrees (module tests)
        working-directory: server
        run: |
          go vet ./internal/modules/ ./internal/rrp/
          go test -count=1 ./internal/modules/ ./internal/rrp/

  # v0.8: приватность — ни телеметрии, ни внешних хостов вне белого списка,
  # ни реальных токенов/приватных IP в доках
  privacy-audit:
    name: Privacy audit (no leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan for telemetry / unknown hosts / private data in docs
        run: python3 scripts/privacy_audit.py .

  # v0.8: known-vulnerabilities gate (stdlib Go)
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum
      - name: Run govulncheck (pinned v1.8.0 + Go 1.27.4 + retry)
        working-directory: server
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            if go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... | tee govulncheck.log; then ok=1; break; fi
            echo "govulncheck attempt $i failed — retry in 15s"; sleep 15
          done
          [ "$ok" = "1" ] || { echo "::error::govulncheck упал 3 раза — см. артефакт govulncheck-log"; exit 1; }
      - name: Upload govulncheck log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-log
          path: server/govulncheck.log
          if-no-files-found: ignore

  # Секреты не пушим: docs/WORKFLOW.md обещает gitleaks в CI — вот он (v0.7)
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR-гейт: залетевшая уязвимая зависимость не доедет до main
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Официальное действие — actions/dependency-review-action (репо
      # actions/dependency-review не существует — раннеры падали
      # «Unable to resolve action … repository not found» на PR-прогонах).
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
