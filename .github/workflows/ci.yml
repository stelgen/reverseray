name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Быстрее и дешевле: новый пуш отменяет устаревший прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test/vet/fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      # Гейт race (без coverage: instrumentation замедляет тайминговые тесты
      # на CI-раннерах — отдельный флейк ловим точечно)
      - name: test (race)
        run: go test -race -count=1 -timeout 10m ./...
      # Гейт coverage (без race — быстрее и стабильнее; race уже проверен выше)
      - name: coverage gate
        run: |
          go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
          load: true
          tags: "reverseray:ci"
      - name: Smoke healthcheck binary exists
        run: docker run --rm --entrypoint /reverseray "reverseray:ci" version

  android:
    name: Android build (debug + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Целостность gradle-wrapper.jar (supply-chain gate перед сборкой)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Кэш Gradle (wrapper + зависимости): ускоряет прогрев с ~5-8 мин до ~1-2 мин
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build + unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --build-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: android/app/build/test-results/
          if-no-files-found: ignore

  assets:
    name: Brand assets (regen + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Unit tests for generator
        run: python3 -m unittest discover -s assets/brand -p 'test_*.py' -v
      - name: Verify committed assets match generator
        run: python3 assets/brand/generate.py --check

  # v0.8: целостность общего манифеста модулей (APK ↔ сервер)
  modules:
    name: Modules integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifest canon check (schema/rrp1/duplicates/policy)
        run: python3 scripts/modules_check.py modules/modules.json
      - name: Go parser agrees (module tests)
        working-directory: server
        run: |
          go vet ./internal/modules/ ./internal/rrp/
          go test -count=1 ./internal/modules/ ./internal/rrp/

  # v0.8: приватность — ни телеметрии, ни внешних хостов вне белого списка,
  # ни реальных токенов/приватных IP в доках
  privacy-audit:
    name: Privacy audit (no leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for telemetry / unknown hosts / private data in docs
        run: python3 scripts/privacy_audit.py .

  # v0.8: known-vulnerabilities gate (stdlib Go)
  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Run govulncheck
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...

  # v0.8: РЕАЛЬНЫЙ скриншот APK на главной репо (не «рисунок в Paint»):
  # эмулятор Android → приложение → adb screencap → робот коммитит в assets/brand
  screenshot:
    name: Real app screenshot (emulator)
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: капризный эмулятор не должен валить CI
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Pillow (for screenshot check)
        run: pip install pillow
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Screenshot on real emulator (ANR-proof, with retries)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # холодный эмулятор: отключаем анимации
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "shot attempt $attempt"
              adb shell am start -W -n dev.stelgen.reverseray/.MainActivity || true
              focused=0
              for i in $(seq 1 45); do
                if adb shell dumpsys window 2>/dev/null | grep mCurrentFocus | grep -qi reverseray; then focused=1; break; fi
                sleep 2
              done
              sleep 3
              adb exec-out screencap -p > shot-raw.png
              if python3 -c "from PIL import Image; import sys; img=Image.open('shot-raw.png').convert('RGB'); c=len(set(img.resize((64,64)).getdata())); print('colors64:', c); sys.exit(0 if c > 16 else 1)"; then
                ok=1
                break
              fi
              # кадр однотонный (ANR-диалог системы): пробуем закрыть диалог и перезапустить приложение
              adb shell input keyevent KEYCODE_BACK || true
              adb shell am force-stop com.android.systemui || true
              adb shell am start -n dev.stelgen.reverseray/.MainActivity || true
              sleep 5
            done
            if [ "$ok" != "1" ]; then echo "no good frame in 5 attempts"; adb logcat -d | tail -60; exit 1; fi
            adb shell pidof dev.stelgen.reverseray | grep -q . || (adb logcat -d | tail -50; exit 1)
      - name: Normalize to 720x1440 and commit
        run: |
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("shot-raw.png").convert("RGB")
          img = img.resize((720, 1440), Image.LANCZOS)
          img.save("assets/brand/screenshot.png", optimize=True)
          print("screenshot normalized:", img.size)
          PY
          if git diff --quiet assets/brand/screenshot.png; then
            echo "screenshot unchanged"
          else
            git config user.name "reverseray-screenshot-bot"
            git config user.email "bot@reverseray.local"
            git add assets/brand/screenshot.png
            git commit -m "[skip ci] docs: real APK screenshot (captured on emulator by CI)"
            git push
          fi

  # Секреты не пушим: docs/WORKFLOW.md обещает gitleaks в CI — вот он (v0.7)
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR-гейт: залетевшая уязвимая зависимость не доедет до main
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review@v4
