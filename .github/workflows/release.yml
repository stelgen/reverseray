name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Релиз не отменяем конкурентом — последовательно
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum
      - run: go vet ./... && go test -race -count=1 ./...

  build-binaries:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: amd64 }
          - { goos: linux, goarch: arm64, suffix: arm64 }
          - { goos: linux, goarch: arm, goarm: "7", suffix: armv7 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${V}" \
            -o "../reverseray-linux-${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.suffix }}
          path: reverseray-linux-*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      # digest собранного multi-arch образа — уезжает в deploy/digests.yaml (v0.8.3)
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # QEMU нужен для сборки arm64/armv7-образов на amd64-раннере
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: push
        with:
          context: ./server
          push: true
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: true
          sbom: true

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build release APK
        env:
          # подпись: секреты владельца при наличии, иначе репозиторный ключ
          RR_KEYSTORE: ${{ secrets.RR_KEYSTORE }}
          RR_KEYSTORE_PASSWORD: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASSWORD: ${{ secrets.RR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon "-PversionName=${GITHUB_REF_NAME#v}"
          # имя артефакта: reverseray-<версия>.apk (не «app-release»)
          mv app/build/outputs/apk/release/app-release.apk              app/build/outputs/apk/release/reverseray-${GITHUB_REF_NAME#v}.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: android/app/build/outputs/apk/release/reverseray-*.apk
          if-no-files-found: error

  # v0.7: паблиш больше НЕ пересобирает бинарии — берёт артефакты build-binaries
  # (раньше релиз делал двойную сборку: +3 джобы и ~5-8 минут на тег).
  publish:
    runs-on: ubuntu-latest
    needs: [build-binaries, docker, build-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # digest-коммит ребейзится на живой main (main уходит за время multi-arch);
          # shallow-клон рвал этот rebase — digest v0.9.7 молча пропал (continue-on-error)
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: bin-*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: apk
      - name: Checksums
        run: cd dist && ls -la && sha256sum * > SHA256SUMS
      # ПАБЛИШ ПЕРВЫМ: никакое пост-хозяйство не должно блокировать выкладку релиза
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
          generate_release_notes: false
      # v0.8.3: digest образа в deploy/digests.yaml (хвост 3 версий) —
      # ПОСТФАКТУМ и не блокирует релиз (continue-on-error). Переменные
      # окружения пробрасываются через env (в python-heredoc bash-переменные
      # не видны — тот баг уронил Release #31).
      - name: Update deploy/digests.yaml (post-factum)
        continue-on-error: true
        env:
          RR_TAG: ${{ github.ref_name }}
          RR_REPO: ${{ github.repository }}
          RR_DIGEST: ${{ needs.docker.outputs.image_digest }}
        run: |
          echo "RR_TAG=$RR_TAG RR_REPO=$RR_REPO RR_DIGEST_LEN=${#RR_DIGEST}" | tee release-digests-debug.txt
          python3 - <<'PY'

          import os, pathlib
          tag = os.environ["RR_TAG"]
          repo = os.environ["RR_REPO"]
          digest = os.environ["RR_DIGEST"]
          assert tag and digest, "RR_TAG/RR_DIGEST не заданы"
          p = pathlib.Path("deploy/digests.yaml")
          s = p.read_text(encoding="utf-8")
          entry = f"  - tag: {tag}\n    image: ghcr.io/{repo}@{digest}\n"
          # дубликаты этого тега сносим, плейсхолдер-комментарий чистим
          s = s.replace("  # - tag: v0.1.0\n", "").replace(
              "  #   image: ghcr.io/stelgen/reverseray@sha256:PLACEHOLDER  # заполнится первым CI-пушем\n", "")
          out, skip = [], False
          for ln in s.splitlines(keepends=True):
              st = ln.strip()
              if st.startswith("- tag:"):
                  skip = (st == f"- tag: {tag}")  # идемпотентно: дубликат тега сносится
                  if skip:
                      continue
              elif skip and st.startswith("image:"):
                  continue
              else:
                  skip = False
              out.append(ln)
          s = "".join(out).rstrip() + "\n" + entry
          p.write_text(s, encoding="utf-8")
          print(s)
          PY
      - name: Upload digests debug (always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digests-debug
          path: release-digests-debug.txt
          if-no-files-found: ignore
      # v1.0.0: явный git-цикл вместо magic-action — magic трижды отчитался
      # success без коммита (v0.9.8/1.0.0 дайджесты писались вручную)
      - name: Commit digest (explicit git-cycle)
        continue-on-error: true # пост-хозяйство: ни при каких условиях не роняет релиз
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/digests.yaml
          if git diff --cached --quiet; then echo "digests unchanged"; exit 0; fi
          git commit -m "[skip ci] chore(release): digest ${{ github.ref_name }} в deploy/digests.yaml"
          git pull --rebase origin main
          git push origin HEAD:main 2> digest-push.log || { echo "::warning::digest push failed"; cat digest-push.log; }
