name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./... && go test -race -count=1 ./...

  build-binaries:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${V}" \
            -o "../reverseray-${GOOS}-${GOARCH}${GOARM:+v$GOARM}" .
      - uses: actions/upload-artifact@v4
        with:
          name: reverseray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: reverseray-*

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: true
          sbom: true

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        env:
          # подпишется, если секреты заданы; иначе unsigned артефакт
          RR_KEYSTORE: ${{ secrets.RR_KEYSTORE }}
          RR_KEYSTORE_PASSWORD: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASSWORD: ${{ secrets.RR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: amd64 }
          - { goos: linux, goarch: arm64, suffix: arm64 }
          - { goos: linux, goarch: arm, goarm: "7", suffix: armv7 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${V}" \
            -o "../reverseray-linux-${{ matrix.suffix }}" .
      - name: Stage
        run: |
          mkdir -p dist
          cp reverseray-linux-${{ matrix.suffix }} dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [github-release, build-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: rel-*
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: apk
      - name: Checksums
        run: cd dist && ls -la && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
