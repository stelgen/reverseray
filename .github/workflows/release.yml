name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Релиз не отменяем конкурентом — последовательно
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go vet ./... && go test -race -count=1 ./...

  build-binaries:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, suffix: amd64 }
          - { goos: linux, goarch: arm64, suffix: arm64 }
          - { goos: linux, goarch: arm, goarm: "7", suffix: armv7 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${V}" \
            -o "../reverseray-linux-${{ matrix.suffix }}" .
      - uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.suffix }}
          path: reverseray-linux-*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      # digest собранного multi-arch образа — уезжает в deploy/digests.yaml (v0.8.3)
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      # QEMU нужен для сборки arm64/armv7-образов на amd64-раннере
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ./server
          push: true
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: true
          sbom: true

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release APK
        env:
          # подпись: секреты владельца при наличии, иначе репозиторный ключ
          RR_KEYSTORE: ${{ secrets.RR_KEYSTORE }}
          RR_KEYSTORE_PASSWORD: ${{ secrets.RR_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.RR_KEY_ALIAS }}
          RR_KEY_PASSWORD: ${{ secrets.RR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon "-PversionName=${GITHUB_REF_NAME#v}"
          # имя артефакта: reverseray-<версия>.apk (не «app-release»)
          mv app/build/outputs/apk/release/app-release.apk              app/build/outputs/apk/release/reverseray-${GITHUB_REF_NAME#v}.apk
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: android/app/build/outputs/apk/release/reverseray-*.apk
          if-no-files-found: error

  # v0.7: паблиш больше НЕ пересобирает бинарии — берёт артефакты build-binaries
  # (раньше релиз делал двойную сборку: +3 джобы и ~5-8 минут на тег).
  publish:
    runs-on: ubuntu-latest
    needs: [build-binaries, docker, build-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
          pattern: bin-*
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
          pattern: apk
      - name: Checksums
        run: cd dist && ls -la && sha256sum * > SHA256SUMS
      # v0.8.3: digest образа в deploy/digests.yaml (хвост 3 версий) —
      # источник для прод-пиннов и отката (шапка файла обещала это давно).
      - name: Update deploy/digests.yaml
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("deploy/digests.yaml")
          s = p.read_text()
          entry = f"  - tag: {GITHUB_REF_NAME}\n    image: ghcr.io/{GITHUB_REPOSITORY}@{DIGEST}\n"
          # сносим комментарий-плейсхолдер после первого заполнения и дубликаты тега
          s = s.replace("  # - tag: v0.1.0\n", "").replace("  #   image: ghcr.io/stelgen/reverseray@sha256:PLACEHOLDER  # заполнится первым CI-пушем\n", "")
          lines = s.splitlines(keepends=True)
          out, skip = [], False
          for ln in lines:
              if ln.startswith("  - tag:"):
                  skip = ln.strip() == entry.strip()
              if skip and (ln.startswith("  - tag:") or ln.startswith("    image:")):
                  continue
              skip = skip and not ln.startswith("  - tag:")
              out.append(ln)
          s = "".join(out).rstrip() + "\n" + entry
          p.write_text(s)
          print(s)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "[skip ci] chore(release): digest ${{ github.ref_name }} в deploy/digests.yaml"
          file_pattern: deploy/digests.yaml
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
          generate_release_notes: false
