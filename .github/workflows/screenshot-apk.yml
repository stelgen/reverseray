name: Screenshot APK
# v0.9.6: ФИНАЛЬНОЕ решение скриншот-робота — БЕЗ ЭМУЛЯТОРА.
#
# История (v0.9.3–v0.9.5): CI-эмулятор падал месяцами — то «adb not found»,
# то /dev/kvm, то AVD не создаётся, то boot не дожимается за 4×450с на
# загруженном раннере. Каждая починка — новый флейк. Решение: Robolectric
# NATIVE graphics рендерит НАСТОЯЩИЕ пиксели MainActivity на JVM —
# детерминированно, за ~2 минуты, без KVM/AVD/adb вообще.
#
# Принципы сохранены:
#  - асинхронно ПОСЛЕ релиза (workflow_run) + cron + dispatch;
#  - коммитит ТОЛЬКО assets/brand/screenshot.png;
#  - упал — упал только этот воркфлоу (CI/Release/web-бот не трогает).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 2 * * 1"
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: screenshot-apk
  cancel-in-progress: true

jobs:
  apk:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # скриншот рендерим ИЗ ПОСЛЕДНЕГО КОДА main (бот документирует прод)
          # fetch-depth: 0 — rebase:true в auto-commit рвётся на shallow-клоне,
          # когда main уходит вперёд за время рендера (Release #42, гонка с web-ботом)
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Render main screen to PNG (Robolectric native graphics)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*ScreenshotBot*' --no-daemon
          test -f app/build/screenshot.png || { echo "::error::PNG не создан"; exit 1; }
          ls -la app/build/screenshot.png
      - name: Copy asset
        run: |
          mkdir -p assets/brand
          cp android/app/build/screenshot.png assets/brand/screenshot.png
      # v0.9.9: явный git-цикл вместо magic-action — каждая ошибка попадает
      # в push.log, при фейле уезжает артефактом (без токена логи нечитаемы)
      - name: Commit screenshot (explicit + push-log artifact on failure)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/screenshot.png
          if git diff --cached --quiet; then echo "PNG identical — nothing to commit"; exit 0; fi
          git commit -m "[skip ci] docs: свежий скриншот APK (бот JVM-рендер, без эмулятора)"
          git pull --rebase origin main || { git pull --rebase origin main; }
          git push origin HEAD:main 2> push.log || { echo "::error::push failed"; cp push.log git-debug.txt; git log --oneline -5 >> git-debug.txt; git status >> git-debug.txt; exit 1; }
      - name: Push failure artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-push-debug
          path: |
            push.log
            git-debug.txt
          if-no-files-found: ignore
