name: Screenshot Web
# v0.9.3: скриншот-роботы РАЗДЕЛЕНЫ на два ПОЛНОСТЬЮ независимых воркфлоу.
# Этот — только веб-панель /ui из ОПУБЛИКОВАННОГО образа релиза
# (headless-chromium); APK-скриншот живёт в screenshot-apk.yml.
#
# Принципы:
#  - асинхронно ПОСЛЕ релиза (workflow_run Release success): ни CI, ни релиз
#    не блокируются и не ждут ни эмулятор, ни chromium;
#  - APK-бот независим: его фейлы/логика/расписание не влияют на этот
#    воркфлоу вообще (раздельные concurrency-группы, раздельные коммиты);
#  - коммитит ТОЛЬКО assets/brand/web.png (README уже встраивает);
#  - ЛЮБОЙ фейл оставляет артефакт-диагностику (логи джоб без токена
#    нечитаемы — урок 08.10);
#  - упал — упал один этот воркфлоу: CI/Release/APK-бот остаются зелёными.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег образа ghcr для веб-панели (пусто = последний релиз)"
        required: false
        default: ""
  schedule:
    - cron: "50 2 * * 1"
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: screenshot-web
  cancel-in-progress: true

jobs:
  web:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve released image tag
        id: tag
        run: |
          T="${{ inputs.tag }}"
          if [ -z "$T" ]; then T="${{ github.event.workflow_run.head_branch }}"; fi
          if [ -z "$T" ]; then
            T=$(curl -fsSL --max-time 15 "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "Веб-панель из образа ghcr.io/stelgen/reverseray:$T"
      - name: Run released server (web panel on 9090)
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          # v0.9.3: явный pull с ретраем (анонимный ghcr — образ публичный,
          # но на загруженном раннере пулл+старт не всегда влезают в 120с;
          # сервер сам по себе здоров — это подтверждает docker-гейт Release)
          pulled=0
          for a in 1 2 3; do
            if docker pull "ghcr.io/stelgen/reverseray:${TAG}"; then pulled=1; break; fi
            sleep 5
          done
          if [ "$pulled" != "1" ]; then
            { echo "== docker version =="; docker version || true; } > web-run-fail.txt || true
            echo "::error::docker pull не удался за 3 попытки — см. артефакт shot-web"
            exit 1
          fi
          ok=""
          for attempt in 1 2; do # v0.9.3: здоровь-ожидание 240с + вторая попытка контейнера
            docker rm -f rr-web >/dev/null 2>&1 || true
            # v0.9.4-фикс КОРНЯ: дефолт admin-листенера в образе = 127.0.0.1:9090
            # (канон приватности) — хост получал RST на каждый коннект (curl 56),
            # при этом in-container healthcheck был зелёный. Явно наружу.
            docker run -d --name rr-web -p 127.0.0.1:9090:9090 \
              -e RR_LISTEN_ADMIN_TCP=:9090 \
              -e RR_STATE_DIR=/var/lib/reverseray \
              "ghcr.io/stelgen/reverseray:${TAG}"
            for i in $(seq 1 120); do # 240с: на загруженном раннере healthy приходит поздно
              st=$(docker inspect --format '{{.State.Health.Status}}' rr-web 2>/dev/null || echo unknown)
              if [ "$st" = "healthy" ]; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = "1" ] && break
            { echo "== attempt $attempt state =="; docker inspect rr-web --format '{{json .State}}' || true
              echo "== health log =="; docker inspect rr-web --format '{{json .State.Health}}' || true
              echo "== logs =="; docker logs --tail 80 rr-web || true; } >> web-run-fail.txt || true
          done
          if [ "$ok" != "1" ]; then
            echo "::error::веб-контейнер не healthy за 2 попытки (240с каждая) — см. артефакт shot-web"
            exit 1
          fi
          # v0.9.4-фикс: финальный curl дал ECONNRESET (exit 56) на 2 релизах
          # подряд: docker-proxy на загруженном раннере сбрасывает первые
          # соединения сразу после healthy, сам контейнер жив. Ретраи решают.
          hz=0
          for i in $(seq 1 15); do
            if curl -fsS --http1.1 --max-time 5 http://127.0.0.1:9090/healthz; then hz=1; break; fi
            sleep 2
          done
          if [ "$hz" != "1" ]; then
            { echo "== healthz fail: container state =="; docker inspect rr-web --format '{{json .State}}' || true
              echo "== healthz fail: container logs =="; docker logs --tail 80 rr-web || true
              echo "== healthz fail: listeners =="; ss -ltnp 2>/dev/null | grep -E '9090|docker-proxy' || true; } >> web-run-fail.txt || true
            echo "::error::healthz на 127.0.0.1:9090 недоступен за 15 попыток — см. артефакт shot-web"
            exit 1
          fi
      - name: Web panel screenshot (headless chromium)
        run: |
          set -e
          pip install playwright pillow
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1280, "height": 860})
              # v0.9.4: навигация с ретраями (первый коннект через docker-proxy может быть сброшен)
              for attempt in range(3):
                  try:
                      pg.goto("http://127.0.0.1:9090/ui", wait_until="networkidle", timeout=30000)
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      pg.wait_for_timeout(2000)
              pg.wait_for_timeout(1500)  # даём JSON-карточкам отрисоваться
              pg.screenshot(path="web-raw.png", full_page=True)
              b.close()
          print("web-raw.png done")
          PY
      - name: Upload web-shot diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shot-web
          path: |
            web-raw.png
            web-run-fail.txt
          if-no-files-found: warn
      - name: Normalize + commit web screenshot
        run: |
          python3 - <<'PY'
          from PIL import Image
          web = Image.open("web-raw.png").convert("RGB")
          w = 1200
          web = web.resize((w, round(web.height * w / web.width)), Image.LANCZOS)
          web.save("assets/brand/web.png", optimize=True)
          print("normalized:", web.size)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "[skip ci] docs: свежий скриншот веб-панели (бот, независимый воркфлоу после релиза)"
          file_pattern: "assets/brand/web.png"
          branch: main
          rebase: true