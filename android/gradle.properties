org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Jetifier выключен: все зависимости AndroidX-native, legacy support-lib не используется
android.enableJetifier=false
android.nonTransitiveRClass=true
# AGP 8.7.3 официально тестирован до compileSdk 35; 36 собирается с предупреждением — глушим
android.suppressUnsupportedCompileSdk=36
# v0.7: ускорение сборки (CI и локально)
org.gradle.caching=true
org.gradle.parallel=true
