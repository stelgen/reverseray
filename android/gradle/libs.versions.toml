[versions]
agp = "8.7.3"
kotlin = "2.1.0"

# Пин AndroidX: последние версии с minSdk 14 (до требования AndroidX minSdk 19, окт 2023)
appcompat = "1.6.1"
coreKtx = "1.9.0"
material = "1.9.0"

# BouncyCastle: TLS 1.3-клиент (платформенный JSSE полноценный TLS 1.3 даёт только с API 29+,
# BC тянет minSdk 14). 1.80 = пост-миграция на TlsCrypto-API (DefaultTlsClient(TlsCrypto),
# ALPN через getProtocolNames()/ProtocolName)
bcprov = "1.80"
bctls = "1.80"

zxingEmbedded = "4.3.0"
desugarJdkLibs = "2.1.3"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bcprov" }
bouncycastle-bctls = { group = "org.bouncycastle", name = "bctls-jdk18on", version.ref = "bctls" }
zxing-android-embedded = { group = "journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
