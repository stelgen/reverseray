services:
  reverseray:
    # Прод: пин по digest (см. deploy/digests.yaml). Автообновления запрещены.
    image: ghcr.io/stelgen/reverseray:v0.1.0
    container_name: reverseray
    ports:
      - "${RR_SOCKS_PORT:-1080}:1080"
      - "${RR_TUNNEL_PORT:-443}:443"
      - "127.0.0.1:${RR_METRICS_PORT:-9090}:9090" # admin/metrics только с localhost
    environment:
      RR_STATE_DIR: /var/lib/reverseray
      RR_LISTEN_TUNNELS: ":443"
      RR_LISTEN_MIXED: ":1080"
      RR_LISTEN_ADMIN_TCP: ":9090"
      RR_LOG_LEVEL: "info"
    volumes:
      - ./state:/var/lib/reverseray
      # - ./config.json:/etc/reverseray/config.json:ro
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:runtime/default
    pids_limit: 100
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/reverseray", "healthcheck", "-url", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
