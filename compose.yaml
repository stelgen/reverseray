services:
  reverseray:
    # Прод: пин по digest (см. deploy/digests.yaml). Автообновления запрещены.
    image: ghcr.io/stelgen/reverseray:${RR_IMAGE_TAG:-v0.8.0}
    container_name: reverseray
    ports:
      - "${RR_SOCKS_PORT:-1080}:1080"
      - "${RR_SOCKS_PORT:-1080}:1080/udp" # v0.7: SOCKS5 UDP ASSOCIATE через туннель
      - "${RR_TUNNEL_PORT:-4433}:4433"
      - "${RR_METRICS_BIND:-127.0.0.1}:${RR_METRICS_PORT:-9090}:9090" # admin/metrics/web UI; RR_METRICS_BIND=0.0.0.0 откроет /ui в LAN
    environment:
      RR_STATE_DIR: /var/lib/reverseray
      # Протокол туннеля по умолчанию (RR_PROTOCOL). Мусорное/пустое значение
      # сводится к самому стабильному протоколу (rrp1) без ошибки — v0.7.4.
      RR_PROTOCOL: "${RR_PROTOCOL:-rrp1}"
      # RR_PUBLIC_HOST: my-home.example.com   # DDNS-домен: используется в конфиг-строках вместо IP
      RR_LISTEN_TUNNELS: ":4433"
      RR_LISTEN_MIXED: ":1080"
      RR_LISTEN_ADMIN_TCP: ":9090"
      RR_LOG_LEVEL: "info"
      # v0.8: WAN-hardening туннельного порта (анти-скан/tarpit). Отключить:
      # RR_HARDENING: "false"
      RR_HARDENING: "true"
      # v0.8: модули — общий манифест APK↔сервер; чек раз в сутки,
      # скачивание только при изменении версии/хеша.
      RR_MODULES_AUTO: "true"
      RR_MODULES_CHECK_HOURS: "24"
      # v0.8: governor перезапусков — падения раз в ≥30 с; 20 подряд →
      # контейнер падает с ошибкой (без бесконечного цикла).
      RR_RESTART_DELAY: "30"
      RR_RESTART_MAX: "20"
      # Inbound-прокси по умолчанию БЕЗ авторизации (HTTP+SOCKS5).
      # Захотел пароль — раскомментируй (и обнови Xray-аутбаунд: socks+user/pass):
      # RR_AUTH_USERNAME: myuser
      # RR_AUTH_PASSWORD: mypassword
    volumes:
      - ./state:/var/lib/reverseray
      # - ./config.json:/etc/reverseray/config.json:ro
    # v0.7.3 ФИКС "permission denied": Dockerfile-пользователь 65532 (nonroot)
    # не мог писать в root-owned bind-mount ./state (Portainer/хост) →
    # crash-loop "bootstrap: write tokens: permission denied".
    # Теперь контейнер работает под root БЕЗ capabilities (cap_drop: ALL):
    # запись в state работает на любом host-каталоге, chown не нужен.
    # Hardening-вариант (когда-нибудь): user: "65532:65532" +
    # sudo chown -R 65532:65532 state
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # v0.8: healthcheck обязателен (канон) — Docker видит реальное здоровье.
    healthcheck:
      test: ["CMD", "/reverseray", "healthcheck", "-url", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
